<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" role="img" aria-label="Naiwa-ism light wallpaper: an upright pear-shaped yellow creature with a duck-bill snout, one small round eye, a thin flat mouth, short arms folded over a pale belly and big three-toed feet">
  <defs>
    <filter id="wall-light-blur" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="120"/>
    </filter>
    <filter id="wall-light-soft" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="wall-light-noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="wall-light-body" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F8CE66"/>
      <stop offset="0.55" stop-color="#F5C518"/>
      <stop offset="1" stop-color="#EFA93C"/>
    </linearGradient>
    <radialGradient id="wall-light-belly" cx="0.45" cy="0.42" r="0.72">
      <stop offset="0" stop-color="#FDF1CB"/>
      <stop offset="1" stop-color="#FBE1A0"/>
    </radialGradient>
    <radialGradient id="wall-light-eye" cx="0.4" cy="0.34" r="0.8">
      <stop offset="0" stop-color="#2A2A1D"/>
      <stop offset="1" stop-color="#101008"/>
    </radialGradient>
    <pattern id="wall-light-scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="6" height="1" fill="#1A1A1A" opacity="0.05"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="2560" height="1440" fill="#FBF3DC"/>
  <g filter="url(#wall-light-blur)">
    <ellipse cx="520" cy="380" rx="520" ry="320" fill="#F5EBCB"/>
    <ellipse cx="1180" cy="170" rx="420" ry="230" fill="#F9E6A8" opacity="0.9"/>
    <ellipse cx="2200" cy="400" rx="470" ry="300" fill="#F5C518" opacity="0.15"/>
    <ellipse cx="1960" cy="1190" rx="520" ry="280" fill="#FFF7E6" opacity="0.8"/>
  </g>
  <ellipse cx="1730" cy="1394" rx="430" ry="44" fill="#1A1A1A" opacity="0.10"/>
  <path d="M 1700 250 C 1560 250 1470 320 1452 405 L 1352 452 L 1448 496 C 1428 560 1420 620 1404 690 C 1360 820 1352 960 1408 1080 C 1440 1160 1470 1220 1496 1268 L 1492 1400 L 1624 1400 L 1630 1318 C 1700 1336 1786 1336 1852 1318 L 1856 1400 L 1988 1400 L 1984 1268 C 2038 1196 2088 1112 2102 1000 C 2124 848 2084 692 2018 584 C 1962 492 1884 424 1822 372 C 1790 300 1752 250 1700 250 Z" fill="url(#wall-light-body)" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>
  <path d="M 1462 402 C 1390 398 1330 416 1326 438 C 1322 460 1390 474 1458 470 Z" fill="#F8D27C" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
  <path d="M 1338 452 C 1380 464 1422 464 1452 454" fill="none" stroke="#B57F28" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="1732" cy="982" rx="252" ry="242" fill="url(#wall-light-belly)" opacity="0.92"/>
  <path d="M 1450 848 C 1398 890 1380 940 1386 992" fill="none" stroke="#EFA93C" stroke-width="56" stroke-linecap="round"/>
  <path d="M 1994 858 C 2040 898 2058 944 2052 994" fill="none" stroke="#EFA93C" stroke-width="50" stroke-linecap="round"/>
  <ellipse cx="1522" cy="392" rx="12" ry="15" fill="url(#wall-light-eye)"/>
  <circle cx="1518" cy="386" r="3.4" fill="#FFFFFF" opacity="0.85"/>
  <ellipse cx="1556" cy="1400" rx="74" ry="24" fill="#E8A24A"/>
  <ellipse cx="1924" cy="1400" rx="74" ry="24" fill="#E8A24A"/>
  <g fill="#D98F36">
    <circle cx="1500" cy="1406" r="12"/><circle cx="1548" cy="1410" r="12"/><circle cx="1596" cy="1406" r="12"/>
    <circle cx="1868" cy="1406" r="12"/><circle cx="1916" cy="1410" r="12"/><circle cx="1964" cy="1406" r="12"/>
  </g>
  <path d="M 0 1140 L 210 1140 L 188 1440 L 0 1440 Z" fill="#F5C518" opacity="0.14"/>
  <path d="M 2320 520 L 2560 520 L 2560 720 L 2360 704 Z" fill="#1A1A1A" opacity="0.10"/>
  <path d="M 980 0 L 1120 0 L 1120 118 L 1010 106 Z" fill="#F5C518" opacity="0.08"/>
  <path d="M 2400 980 L 2560 962 L 2560 1040 L 2420 1030 Z" fill="#7DF9AA" opacity="0.16"/>
  <rect x="0" y="0" width="2560" height="1440" filter="url(#wall-light-noise)" opacity="0.06"/>
  <rect x="0" y="0" width="2560" height="1440" fill="url(#wall-light-scan)"/>
</svg>
